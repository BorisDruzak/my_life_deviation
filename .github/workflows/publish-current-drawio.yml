name: Одноразовая публикация текущей схемы v0.1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-current-drawio.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Восстановить точную копию схемы из проверенного содержимого
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib
          payload = ''''''
          raw = lzma.decompress(base64.b64decode(payload))
          expected = 'a8f8c42ad14d36cbf679b0a6a4b4c00ebea360ec88a650b5c2003f5a40b58c6c'
          actual = hashlib.sha256(raw).hexdigest()
          assert actual == expected, (actual, expected)
          path = Path('Документация/Схемы/Зачем_что-то_делать_v0.1.drawio')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(raw)
          print(path, len(raw), actual)
          PY
      - name: Зафиксировать схему в main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Документация/Схемы/Зачем_что-то_делать_v0.1.drawio'
          git commit -m 'docs: добавить текущую схему модели НПС v0.1'
          git push origin HEAD:main
