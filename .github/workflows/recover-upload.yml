name: Recover previously uploaded T1 data
on:
  push:
    branches: ['release/world-0.5.1-t1']
    paths: ['.github/workflows/recover-upload.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - name: Recover complete files from verified upload prefix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, json, base64, hashlib, lzma, io, tarfile, zipfile
          from pathlib import Path, PurePosixPath
          shas = ['cc25e27e8f049857d4c13181d3fab00c81e748fd', '20aaa4b0907ca7272b6e8953812a4a384b277437', '9671dfac1366c6fef6c9eea1936bf6cbbd48947d', '6bfe674fd2a6ee8d78576ad533dcee40e4da21e1', '1e75beb898d85ff90487628599b8e6b68c568e11']
          parts = []
          for sha in shas:
              req = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=60) as f:
                  blob = json.load(f)
              raw = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == sha
              parts.append(raw.strip())
          encoded = b''.join(parts)
          encoded = encoded[:len(encoded)//4*4]
          compressed = base64.b64decode(encoded, validate=True)
          decoder = lzma.LZMADecompressor()
          raw = decoder.decompress(compressed, max_length=30_000_000)
          print('Verified uploaded prefix bytes:', len(compressed), 'decompressed:', len(raw), 'complete stream:', decoder.eof)
          out = Path('recovered'); out.mkdir()
          records = []
          with zipfile.ZipFile(out/'prefix-files.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              with tarfile.open(fileobj=io.BytesIO(raw), mode='r:') as tar:
                  try:
                      for member in tar:
                          rel = PurePosixPath(member.name)
                          if not member.isfile() or rel.is_absolute() or '..' in rel.parts or '.git' in rel.parts:
                              continue
                          if member.offset_data + member.size > len(raw):
                              break
                          content = tar.extractfile(member).read()
                          assert len(content) == member.size
                          z.writestr(member.name, content)
                          records.append({'path': member.name, 'size': len(content), 'sha256': hashlib.sha256(content).hexdigest()})
                  except (tarfile.ReadError, EOFError):
                      pass
          (out/'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2))
          print('Recovered complete files:', len(records))
          for rec in records: print(rec['path'], rec['size'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-t1-prefix
          path: recovered/
          retention-days: 3
