name: Одноразовое исправление версии документа v0.2.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-npc-doc-v021.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Переименовать документ и исправить номер версии
        shell: bash
        run: |
          set -euo pipefail
          OLD='Документация/Механики/Обучение_свойства_и_внутренние_расчеты_НПС_v2.1.md'
          NEW='Документация/Механики/Обучение_свойства_и_внутренние_расчеты_НПС_v0.2.1.md'
          test -f "$OLD"
          test ! -e "$NEW"
          mv "$OLD" "$NEW"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Документация/Механики/Обучение_свойства_и_внутренние_расчеты_НПС_v0.2.1.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('**Версия документа:** v2.1', '**Версия документа:** v0.2.1', 1)
          text = text.replace('В v2.1 фиксируются следующие уровни:', 'В v0.2.1 фиксируются следующие уровни:')
          p.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/rename-npc-doc-v021.yml

      - name: Зафиксировать исправление
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: исправить версию модели НПС на v0.2.1'
          git push
